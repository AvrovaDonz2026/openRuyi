[package]
name = "rand_distr"
version = "0.4.3"
authors = ["The Rand Project Developers"]
edition = "2018"
description = "Sampling from random number distributions"
homepage = "https://rust-random.github.io/book"
documentation = "https://docs.rs/rand_distr"
readme = "README.md"
keywords = ["random", "rng", "distribution", "probability"]
categories = ["algorithms", "no-std"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-random/rand"
include = ["src/", "LICENSE-*", "README.md", "CHANGELOG.md", "COPYRIGHT"]

[features]
default = ["std"]
std = ["alloc", "rand/std"]
alloc = ["rand/alloc"]
std_math = ["num-traits/std"]
serde1 = ["serde", "rand/serde1"]

[dependencies.num-traits]
version = "0.2"
features = ["libm"]
default-features = false

[dependencies.rand]
version = "0.8.0"
default-features = false

[dependencies.serde]
version = "1.0.103"
features = ["derive"]
optional = true

[dev-dependencies.average]
version = "0.13"
features = ["std"]

[dev-dependencies.rand]
version = "0.8.0"
features = ["std_rng", "std", "small_rng"]
default-features = false

[dev-dependencies.rand_pcg]
version = "0.3.0"

[dev-dependencies.special]
version = "0.8.1"
