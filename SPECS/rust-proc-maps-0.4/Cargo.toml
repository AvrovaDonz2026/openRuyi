[package]
name = "proc-maps"
version = "0.4.0"
authors = ["Julia Evans <julia@jvns.ca>", "Ben Frederickson <github@benfrederickson.com>", "Adam Jensen <adam@acj.sh>"]
description = "Helper crate for getting virtual memory maps from processes"
homepage = "https://github.com/rbspy/proc-maps"
readme = "README.md"
license = "MIT"
repository = "https://github.com/rbspy/proc-maps"

[dependencies.libc]
version = "0.2.54"

[features]
default = ["generate-bindings"]
generate-bindings = ["bindgen"]

[target."cfg(target_os=\"freebsd\")".build-dependencies.bindgen]
version = "0.70.1"
optional = true

[target."cfg(target_os=\"macos\")".dependencies.anyhow]
version = "1.0.40"

[target."cfg(target_os=\"macos\")".dependencies.libproc]
version = "0.14.2"

[target."cfg(target_os=\"macos\")".dependencies.mach2]
version = "0.4.0"

[target."cfg(windows)".dependencies.winapi]
version = "0.3"
features = ["tlhelp32", "processthreadsapi", "handleapi", "impl-default", "dbghelp", "memoryapi", "sysinfoapi"]
