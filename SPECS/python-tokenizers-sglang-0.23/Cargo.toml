# This normalized manifest is derived from the upstream tokenizers 0.23.2
# Python binding manifest and is supplied for the offline build audit.
[package]
name = "tokenizers-python"
version = "0.23.2"
edition = "2021"

[lib]
name = "tokenizers"
crate-type = ["cdylib"]

[dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["rc", "derive"] }
serde_json = "1.0"
libc = "0.2"
env_logger = "0.11"
pyo3 = { version = "=0.29", default-features = false, features = ["py-clone", "experimental-inspect"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { version = "1.47.1", features = ["rt", "rt-multi-thread", "macros", "signal"] }
once_cell = "1.19.0"
numpy = "0.29"
ndarray = "0.16"
itertools = "0.14"
ahash = { version = "0.8.11", features = ["serde"] }
pyo3-ffi = { version = "=0.29" }

[dependencies.tokenizers]
path = "../../tokenizers"

[build-dependencies]
pyo3-build-config = "=0.29"

[features]
default = ["ext-module", "abi3", "parity-aware-bpe"]
ext-module = ["pyo3/extension-module"]
abi3 = ["pyo3/abi3", "pyo3/abi3-py310"]
parity-aware-bpe = ["tokenizers/parity-aware-bpe"]
