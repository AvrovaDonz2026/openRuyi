[package]
edition = "2021"
rust-version = "1.56.1"
name = "clap_complete"
version = "3.2.5"
description = "Generate shell completion scripts for your clap::Command"
license = "MIT OR Apache-2.0"
repository = "https://github.com/clap-rs/clap"

[dependencies.clap]
version = "3.2.1"
features = ["std"]
default-features = false

[dependencies.clap_lex]
version = "0.2.2"
optional = true

[dependencies.is_executable]
version = "1.0.1"
optional = true

[dependencies.os_str_bytes]
version = "6.0"
features = ["raw_os_str"]
optional = true
default-features = false

[dependencies.pathdiff]
version = "0.2.1"
optional = true

[dependencies.shlex]
version = "1.1.0"
optional = true

[dependencies.unicode-xid]
version = "0.2.2"
optional = true

[features]
debug = ["clap/debug"]
default = []
unstable-dynamic = ["clap_lex", "shlex", "unicode-xid", "os_str_bytes", "clap/derive", "is_executable", "pathdiff"]
